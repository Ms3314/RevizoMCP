[project]
name = "revizo"
version = "0.1.0"
description = "Revizo - spaced-repetition revision coach for DSA problems, as an MCP server: due lists, mistake tracking, weak points, LeetCode sync"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "cryptography>=50.0.1",
    "jinja2>=3.1.6",
    "mcp[cli]>=2.2.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
