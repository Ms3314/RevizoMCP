<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#09090b" />
  <title>{% block title %}Revizo{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/mark.svg" />
  <link rel="stylesheet" href="{{ CSS_URL }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    summary::-webkit-details-marker { display: none; }
    summary { list-style: none; }
    ::selection { background: rgba(59, 130, 246, 0.3); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 8px; border: 2px solid #09090b; }
    ::-webkit-scrollbar-track { background: transparent; }
    html { font-feature-settings: "cv02", "cv03", "cv04"; }
    .doc-p  { margin-top: 0.75rem; font-size: 13.5px; line-height: 1.75; color: #a1a1aa; }
    .doc-h2 { padding-top: 2.5rem; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #f4f4f5; }
    .doc-li { display: flex; gap: 0.625rem; margin-top: 0.625rem; font-size: 13.5px; line-height: 1.7; color: #a1a1aa; }
    .doc-li::before { content: ""; margin-top: 8px; height: 3px; width: 3px; flex-shrink: 0; border-radius: 9999px; background: #52525b; }
    .doc-strong { color: #f4f4f5; font-weight: 500; }
  </style>
</head>
<body class="min-h-screen bg-[#09090b] font-sans text-zinc-200 antialiased">
  {% block body %}{% endblock %}
</body>
</html>
